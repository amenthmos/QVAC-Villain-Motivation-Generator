<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Villain Motivation Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: linear-gradient(160deg, #1c1c26 0%, #2e1a2e 100%);
    font-family: system-ui, sans-serif; color: #eae0f0; display: flex; justify-content: center; padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 560px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; color: #d94f70; font-weight: 800; text-align: center; }
  .subtitle { color: #b39ab8; margin-bottom: 24px; font-size: 0.9rem; text-align: center; }
  .card { background: #262230; border-radius: 16px; padding: 28px 26px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  label { display: block; font-size: 0.85rem; color: #b39ab8; margin-bottom: 6px; font-weight: 600; }
  textarea {
    width: 100%; min-height: 80px; padding: 12px 14px; border-radius: 10px; border: 2px solid #4a3a52;
    background: #1c1826; color: #eae0f0; font-family: inherit; font-size: 1rem; margin-bottom: 16px; resize: vertical;
  }
  button.action {
    padding: 12px 28px; border: none; border-radius: 999px; font-size: 1rem; font-weight: 700;
    font-family: inherit; cursor: pointer; background: #d94f70; color: #fff; display: block; margin: 0 auto;
  }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #b39ab8; min-height: 1.2em; text-align: center; }
  .result-box {
    margin-top: 20px; padding: 18px; background: #1c1826; border-radius: 12px; border: 1px solid #4a3a52;
    font-size: 1rem; line-height: 1.6; color: #eae0f0;
  }
  .footer-note { color: #b39ab8; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner {
    display: inline-block; width: 13px; height: 13px; border: 2px solid #4a3a52;
    border-top-color: #d94f70; border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🗡️ Villain Motivation Generator</h1>
    <p class="subtitle">Describe your hero + conflict, get a grounded antagonist motivation. 100% on-device.</p>

    <div class="card">
      <label for="heroInput">Your hero</label>
      <textarea id="heroInput" placeholder="e.g. A young mechanic named Rosa who can repair ancient magical machines."></textarea>
      <label for="conflictInput">Central conflict</label>
      <textarea id="conflictInput" placeholder="e.g. The town's water supply depends on a machine only Rosa can fix, but fixing it floods the mines."></textarea>
      <button class="action" id="generateBtn">Generate Motivation</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const heroInput = document.getElementById('heroInput');
    const conflictInput = document.getElementById('conflictInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const hero = heroInput.value.trim();
      const conflict = conflictInput.value.trim();
      if (!hero || !conflict) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Plotting their motives...';

      try {
        const res = await fetch('/api/villain', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ hero, conflict }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = `<div class="result-box">${escapeHtml(data.motivation)}</div>`;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
  </script>
</body>
</html>
